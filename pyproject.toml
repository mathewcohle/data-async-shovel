[project]
name = "das"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aiofile>=3.9.0"]

[dependency-groups]
dev = ["ruff>=0.8.0", "pyright>=1.1.0"]

[tool.ruff]
target-version = "py313"
src = ["src"]
fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint.isort]
known-first-party = ["das"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
pythonPlatform = "Linux"
include = ["src"]
